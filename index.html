<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Graphic design studio: logos, branding and illustration.">
  <title>SAELVO STUDIO</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --pad: clamp(20px, 4vw, 56px);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #f3f0e9; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

    /* Top: logo/name + short menu */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 20px var(--pad);
      background: #000;
    }
    .logo { font-weight: 700; font-size: 1.05rem; letter-spacing: .16em; }
    .site-header nav { display: flex; gap: clamp(16px, 3vw, 36px); }
    .site-header nav a { font-size: .9rem; opacity: .75; border-bottom: 1px solid transparent; }
    .site-header nav a:hover { opacity: 1; border-color: currentColor; }

    /* One section per category: label on top, row of cards below */
    .section { padding: 28px 0 8px; }
    .section h2 {
      margin: 0 0 6px var(--pad);
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 400;
      letter-spacing: -.01em;
    }
    .row {
      position: relative;
      height: clamp(300px, 32vw, 420px);
      overflow: hidden;
      perspective: 1000px;
      touch-action: pan-y;
    }

    .card {
      position: absolute; top: 50%; left: 50%;
      width: clamp(150px, 15vw, 230px);
      aspect-ratio: 0.8;
      padding: 10px;
      border: 0;
      border-radius: 14px;
      color: #f3f0e9;
      background: var(--card-color);
      box-shadow: 0 12px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.07);
      appearance: none;
      cursor: pointer;
      will-change: transform, opacity;
      display: flex; flex-direction: column;
    }
    .portrait {
      flex: 1; min-height: 0;
      overflow: hidden;
      border-radius: 9px;
      background: rgba(0,0,0,.25);
    }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .portrait img[hidden] { display: none; }
    .identity { padding-top: 9px; text-align: center; font-size: .8rem; line-height: 1.2; }
    .name { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cta {
      display: inline-block; margin-top: 6px; padding: 3px 10px;
      border-radius: 999px; background: rgba(0,0,0,.75);
      font-size: .62rem; letter-spacing: .04em;
    }

    footer { padding: 32px var(--pad) 40px; color: rgba(243,240,233,.5); font-size: .85rem; }

    @media (prefers-reduced-motion: reduce) { .card { will-change: auto; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">SAELVO STUDIO</a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
    </nav>
  </header>

  <main id="work"></main>

  <footer>&copy; 2026 SAELVO STUDIO</footer>

  <script>
    (() => {
      /*
        YOUR PROJECTS: edit this list.
        - title:    project name shown on the card
        - category: the section it appears in (Logo, Illustration, ...). Sections are created automatically.
        - color:    card background color
        - image:    path to your image, e.g. "images/logo-01.jpg" (leave "" until you have one)
        - href:     page to open when the front card is clicked ("#" = nothing yet)
        To add a project, copy one { ... }, line. To remove one, delete its line.
      */
      const projects = [
        { title: "Project title 01", category: "Logo",         color: "#414552", image: "", href: "#" },
        { title: "Project title 02", category: "Logo",         color: "#1e2b2d", image: "", href: "#" },
        { title: "Project title 03", category: "Logo",         color: "#624936", image: "", href: "#" },
        { title: "Project title 04", category: "Logo",         color: "#624956", image: "", href: "#" },
        { title: "Project title", category: "Branding",     color: "#5b5d37", image: "", href: "#" },
        { title: "Project title", category: "Branding",     color: "#4a3a48", image: "", href: "#" },
        { title: "Project title", category: "Branding",     color: "#2f4250", image: "", href: "#" },
        { title: "Project title", category: "Illustration", color: "#6a4141", image: "", href: "#" },
        { title: "Project title", category: "Illustration", color: "#3b4b3a", image: "", href: "#" },
        { title: "Project title", category: "Illustration", color: "#4d4a36", image: "", href: "#" }
      ];

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const main = document.querySelector("#work");
      const rows = [];

      [...new Set(projects.map((p) => p.category))].forEach((category) => {
        const items = projects.filter((p) => p.category === category);
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `<h2>${category}</h2><div class="row" role="group" aria-label="${category} projects"></div>`;
        main.append(section);
        const row = section.querySelector(".row");

        const r = { row, items, phase: 0, target: 0, base: 0, active: false };
        r.count = items.length;
        r.cards = items.map((item, i) => {
          const card = document.createElement("button");
          card.className = "card";
          card.type = "button";
          card.style.setProperty("--card-color", item.color);
          card.setAttribute("aria-label", `${item.title}, ${category}`);
          card.innerHTML = `
            <span class="portrait"><img src="${item.image}" alt="${item.title}" ${item.image ? "" : "hidden"}></span>
            <span class="identity"><span class="name">${item.title}</span><span class="cta" aria-hidden="true">View project</span></span>`;
          card.addEventListener("click", () => {
            if (i === front(r) && item.href && item.href !== "#") { location.href = item.href; return; }
            go(r, i);
          });
          card.addEventListener("focus", () => go(r, i));
          row.append(card);
          return card;
        });

        row.addEventListener("pointermove", (e) => {
          const b = row.getBoundingClientRect();
          const nx = Math.max(-1, Math.min(1, ((e.clientX - b.left) / b.width - 0.5) * 2));
          r.active = true;
          r.target = r.base + nx * 0.9;
        });
        row.addEventListener("pointerleave", () => { r.active = false; r.target = r.base; });
        row.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") { r.base += 1; r.target = r.base; e.preventDefault(); }
          if (e.key === "ArrowLeft")  { r.base -= 1; r.target = r.base; e.preventDefault(); }
        });
        rows.push(r);
      });

      function wrap(d, n) {
        while (d > n / 2) d -= n;
        while (d < -n / 2) d += n;
        return d;
      }
      function front(r) { return ((Math.round(r.phase) % r.count) + r.count) % r.count; }
      function go(r, i) { r.base += wrap(i - front(r), r.count); r.target = r.base; }

      let prev = performance.now();
      function render(t) {
        const dt = Math.min(32, t - prev); prev = t;
        const ease = reduced ? 1 : 1 - Math.pow(0.001, dt / 1000);
        rows.forEach((r) => {
          r.phase += (r.target - r.phase) * ease;
          const cardW = r.cards[0].offsetWidth;
          r.cards.forEach((card, i) => {
            const d = wrap(i - r.phase, r.count);
            const a = Math.abs(d);
            const x = d * cardW * 0.82;
            const scale = Math.max(0.55, 1 - a * 0.17);
            const rotY = -d * 16;
            card.style.zIndex = String(Math.round(100 - a * 10));
            card.style.opacity = String(a > 2.6 ? 0 : Math.max(0.25, 1 - a * 0.28));
            card.style.pointerEvents = a > 2.6 ? "none" : "auto";
            card.style.transform = `translate(-50%, -50%) translate3d(${x.toFixed(1)}px, 0, ${(-a * 40).toFixed(1)}px) rotateY(${rotY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
          });
        });
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
